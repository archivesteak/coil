org.gradle.jvmargs=-Xmx8g -Xms2g -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true

# Android
android.experimental.enableScreenshotTest=true
android.javaCompile.suppressSourceTargetDeprecationWarning=true
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
android.useAndroidX=true

# https://github.com/cashapp/paparazzi/issues/2095
android.newDsl=false

# Disable welcome message.
systemProp.org.gradle.internal.launcher.welcomeMessageEnabled=false

kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true
kotlin.native.jvmArgs=-Xmx8g

kotlinx.atomicfu.enableJsIrTransformation=true
kotlinx.atomicfu.enableJvmIrTransformation=true
kotlinx.atomicfu.enableNativeIrTransformation=true

org.jetbrains.compose.experimental.jscanvas.enabled=true
org.jetbrains.compose.experimental.macos.enabled=true
org.jetbrains.compose.experimental.mingw.enabled=true
org.jetbrains.compose.experimental.uikit.enabled=true
org.jetbrains.compose.experimental.wasm.enabled=true

# Config
minSdk=23
targetSdk=37
compileSdk=37

# Maven publication remains local-only until this fork is explicitly approved for release.
SONATYPE_AUTOMATIC_RELEASE=false
RELEASE_SIGNING_ENABLED=false
coil.remotePublication.enabled=false

# Fork coordinates. Publishing under the upstream group would shadow official Coil artifacts with
# a differently built binary, so this fork uses its own namespace and an explicit platform suffix.
GROUP=io.github.archivesteak.coil3
VERSION_NAME=3.6.0-mingw

POM_DESCRIPTION=Coil fork adding a Kotlin/Native mingwX64 target to the image loading library.
POM_INCEPTION_YEAR=2019

POM_URL=https://github.com/archivesteak/coil
POM_SCM_URL=https://github.com/archivesteak/coil
POM_SCM_CONNECTION=scm:git:https://github.com/archivesteak/coil.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/archivesteak/coil.git

POM_LICENCE_NAME=The Apache License, Version 2.0
POM_LICENCE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENCE_DIST=repo

POM_DEVELOPER_ID=archivesteak
POM_DEVELOPER_NAME=Jack Harrington
POM_DEVELOPER_URL=https://github.com/archivesteak
